# Lint configuration for MAO.
#
# The default rule set plus a small, justified set of per-file exemptions. Each
# exemption below is a deliberate pattern, not a suppressed defect — anything
# not listed here is expected to be clean.

line-length = 110
target-version = "py310"

[lint]
# The architecture review noted that "All checks passed" was a narrower claim
# than it reads, because the selected set was small enough to miss whole
# categories. Widened to the rules that catch real defects in this codebase:
#
#   E4/E7/E9/F/W  the original set: imports, statement errors, syntax, pyflakes
#   B             flake8-bugbear — mutable default arguments, `zip()` without an
#                 explicit strictness, `raise` inside `except` that loses the
#                 cause, over-broad `pytest.raises(Exception)`. This is the
#                 family that catches the fail-open shapes Wave 7 kept finding.
#   C4            comprehension and collection-call correctness
#   PIE           unnecessary or dead constructs
#   RUF           ruff's own checks, including mutable class defaults
#
# What is deliberately NOT selected, so the "All checks passed" line means
# something specific rather than something broad:
#
#   E501   line length — never enforced here; retrofitting buries real findings
#   T20    `print` — 123 hits, essentially all in `__main__` demo blocks and
#          one-shot data scripts, where printing is the point
#   SIM/UP style and idiom modernisation; no defect class behind them here
#   RUF100 unused `# noqa` — 90 stale directives, worth a sweep of its own, but
#          a stale suppression is untidiness, not a defect
#   RUF001-003 ambiguous Unicode — the prose in this codebase uses en-dashes and
#          typographic quotes on purpose
select = ["E4", "E7", "E9", "F", "W", "B", "C4", "PIE", "RUF"]
ignore = ["RUF100", "RUF001", "RUF002", "RUF003"]

[lint.per-file-ignores]
# Streamlit requires st.set_page_config() to be the first Streamlit call, and
# the repo-root sys.path shim must run before any `mao.*` import resolves.
"app/streamlit_app.py" = ["E402"]

# Optional-dependency probes: the import IS the availability check.
"app/graph_explorer.py" = ["F401"]

# Heavy model imports are deferred behind runtime guards on purpose.
"mao/rag/reranker.py" = ["E402"]
"mao/rag/embedder.py" = ["E402"]

# Re-export surfaces.
"__init__.py" = ["F401"]
